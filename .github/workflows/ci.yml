name: ForestGuard AI CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Backend Tests, Frontend Build & Health Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest-timeout

      - name: Python Syntax & Compile Verification
        run: |
          python -m compileall backend scripts training

      - name: Run Backend Integration & Security Tests
        run: |
          pytest backend/tests -v --timeout=90

      - name: Run Model Inference & Degradation Test Suite
        run: |
          python scripts/test_model_inference.py

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Frontend Unit Tests
        run: node --test frontend/src/utils/phoneCamera.test.mjs

      - name: Build Frontend Production Distribution
        working-directory: frontend
        run: npm run build

      - name: Verify Production Distribution Bundle
        run: |
          test -f frontend/dist/index.html
          echo "✓ Frontend distribution verified."

      - name: Upload Test & Verification Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forestguard-ci-reports
          path: |
            results/final_verification_report.txt
            results/inference_test_report.txt
            results/predictions/
          retention-days: 7
